name: Build Brocreate Android APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Free Runner Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h

      - name: Checkout Brocreate Source
        uses: actions/checkout@v4
        with:
          path: krita
          fetch-depth: 2

      - name: Build & Package APK Inside Official KDE Container
        run: |
          cd "$GITHUB_WORKSPACE/krita"
          KDE_IMG="invent-registry.kde.org/sysadmin/ci-images/krita-android-sdk36-2204:latest"
          docker pull "$KDE_IMG"

          cat << 'INNER_EOF' > run_kde_build.sh
          #!/bin/bash
          set -e
          git config --global --add safe.directory '*'

          if [ -f /var/lib/ci-files/setup-environment.sh ]; then
            source /var/lib/ci-files/setup-environment.sh
          fi

          export CI_PROJECT_DIR="/workspace/krita"
          export KDECI_WORKDIR_PATH="/workspace/workdir"
          export KDECI_ANDROID_ABI="arm64-v8a"
          export ANDROID_ABI="arm64-v8a"
          mkdir -p "$KDECI_WORKDIR_PATH"

          cd "$CI_PROJECT_DIR"
          rm -rf krita-deps-management
          git clone --depth=1 https://invent.kde.org/packaging/krita-deps-management.git krita-deps-management
          git clone --depth=1 https://invent.kde.org/packaging/krita-ci-utilities.git krita-deps-management/ci-utilities

          python3 -m venv --upgrade-deps "$KDECI_WORKDIR_PATH/PythonEnv"
          source "$KDECI_WORKDIR_PATH/PythonEnv/bin/activate"
          pip install -r "$CI_PROJECT_DIR/krita-deps-management/requirements.txt"

          # Fix 1: Generate .kde-ci.yml directly in /workspace/krita and disable slow unit tests/cppcheck
          python -s "$CI_PROJECT_DIR/krita-deps-management/tools/generate-deps-file.py" \
            -o "$CI_PROJECT_DIR/.kde-ci.yml" \
            -s "$CI_PROJECT_DIR/krita-deps-management/latest/krita-deps.yml"
          python -c "import yaml; p='$CI_PROJECT_DIR/.kde-ci.yml'; d=yaml.safe_load(open(p)); d.setdefault('Options',{})['build-tests']=False; d['Options']['run-tests']=False; d['Options']['run-cppcheck']=False; yaml.safe_dump(d,open(p,'w'))"
          cp "$CI_PROJECT_DIR/.kde-ci.yml" "$KDECI_WORKDIR_PATH/.kde-ci.yml"

          # Fix 2: Run setup-env.py and source the actual generated env path (/workspace/workdir/krita/env)
          python krita-deps-management/tools/setup-env.py \
            --full-krita-env \
            -v "$KDECI_WORKDIR_PATH/PythonEnv" \
            --android-abi "$KDECI_ANDROID_ABI" \
            --root "$KDECI_WORKDIR_PATH"
          cp "$CI_PROJECT_DIR/.kde-ci.yml" "$KDECI_WORKDIR_PATH/.kde-ci.yml"

          if [ -f "$KDECI_WORKDIR_PATH/krita/env" ]; then
            source "$KDECI_WORKDIR_PATH/krita/env"
          elif [ -f "$CI_PROJECT_DIR/env" ]; then
            source "$CI_PROJECT_DIR/env"
          fi

          # Fix 3: Compile Krita into _install, then package the APK
          build_and_package() {
            python -u "$CI_PROJECT_DIR/krita-deps-management/ci-utilities/run-ci-build.py" \
              --project krita \
              --branch master \
              --platform Android/arm64-v8a \
              --skip-publishing
            python -u "$CI_PROJECT_DIR/build-tools/ci-scripts/build-android-package.py"
          }

          build_and_package || {
            echo "[!] AI C++ patch had a compile error; falling back to clean C++ with Brocreate branding..."
            git checkout HEAD~1 -- libs/ui/ || true
            sed -i 's/"Krita"/"Brocreate"/g' libs/ui/KisMainWindow.cpp libs/ui/KisWelcomePageWidget.cpp || true
            rm -rf "$KDECI_WORKDIR_PATH/krita/_build" "$KDECI_WORKDIR_PATH/krita/_packaging"
            build_and_package
          }

          mkdir -p "$CI_PROJECT_DIR/_packaging"
          find "$KDECI_WORKDIR_PATH" "$CI_PROJECT_DIR" -name "*.apk" -exec cp -v {} "$CI_PROJECT_DIR/_packaging/" \; || true
          INNER_EOF
          chmod +x run_kde_build.sh

          docker run --rm --user root \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace/krita \
            "$KDE_IMG" \
            /bin/bash /workspace/krita/run_kde_build.sh

      - name: Upload Compiled Brocreate APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Brocreate-Android-APK
          path: |
            krita/_packaging/*.apk
            **/*.apk
          if-no-files-found: warn
