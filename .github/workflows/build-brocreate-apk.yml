name: Official KDE Android APK Builder (Brocreate)

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    container:
      image: registry.kde.org/sysadmin/ci-images/krita-android-builder:latest
      options: --user root
    steps:
      - name: Maximize GitHub Runner Disk Space
        run: |
          rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true

      - name: Checkout Brocreate Repository
        uses: actions/checkout@v4
        with:
          path: krita
          fetch-depth: 2

      - name: Set Up Official KDE Android Environment & Prebuilt Deps (arm64-v8a)
        run: |
          git config --global --add safe.directory '*'
          export SRCDIR="$GITHUB_WORKSPACE"
          export WORKDIR="$GITHUB_WORKSPACE/workdir"
          mkdir -p "$WORKDIR"

          # Load official KDE Android SDK/NDK environment variables from container
          if [ -f /var/lib/ci-files/setup-environment.sh ]; then
            source /var/lib/ci-files/setup-environment.sh
          fi
          export KDECI_ANDROID_ABI=arm64-v8a
          export ANDROID_ABI=arm64-v8a

          # Clone official KDE dependency & CI utility scripts
          cd "$SRCDIR/krita"
          git clone --depth=1 https://invent.kde.org/packaging/krita-deps-management.git krita-deps-management
          git clone --depth=1 https://invent.kde.org/packaging/krita-ci-utilities.git krita-deps-management/ci-utilities

          # Set up Python venv and fetch prebuilt Android arm64-v8a libraries
          python3 -m venv --upgrade-deps "$WORKDIR/PythonEnv"
          source "$WORKDIR/PythonEnv/bin/activate"
          python -m pip install -r "$SRCDIR/krita/krita-deps-management/requirements.txt"

          python krita-deps-management/tools/setup-env.py \
            --full-krita-env \
            -v "$WORKDIR/PythonEnv" \
            --android-abi "$KDECI_ANDROID_ABI" \
            --root "$WORKDIR"

      - name: Compile Brocreate APK using Official KDE Script
        run: |
          export SRCDIR="$GITHUB_WORKSPACE"
          export WORKDIR="$GITHUB_WORKSPACE/workdir"
          if [ -f /var/lib/ci-files/setup-environment.sh ]; then
            source /var/lib/ci-files/setup-environment.sh
          fi
          export KDECI_ANDROID_ABI=arm64-v8a
          export ANDROID_ABI=arm64-v8a

          cd "$SRCDIR/krita"
          source "$SRCDIR/krita/env"

          # Attempt 1: Build with full Gemini C++ UI changes
          python build-tools/ci-scripts/build-android-package.py || {
            echo "[!] AI C++ modification had a compile error. Applying clean C++ fallback with Brocreate branding & XMLGUI..."
            git checkout HEAD~1 -- libs/ui/KisMainWindow.h libs/ui/KisMainWindow.cpp libs/ui/KisWelcomePageWidget.h libs/ui/KisWelcomePageWidget.cpp libs/ui/input/kis_input_manager.cpp libs/ui/opengl/kis_opengl_canvas2.cpp
            sed -i 's/"Krita"/"Brocreate"/g' libs/ui/KisMainWindow.cpp libs/ui/KisWelcomePageWidget.cpp
            rm -rf _build _packaging
            python build-tools/ci-scripts/build-android-package.py
          }

      - name: Upload Compiled Brocreate APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Brocreate-Android-APK
          path: |
            **/krita/_packaging/**/*.apk
            **/_packaging/**/*.apk
            **/*.apk
